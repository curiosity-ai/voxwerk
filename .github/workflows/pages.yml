# Publishes the voice browser (site/ + the voice catalog and samples from src/Voices) to the gh-pages branch,
# which GitHub Pages serves (Settings -> Pages -> Source: "Deploy from a branch", branch gh-pages, folder /).
name: Voice browser (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'src/Voices/**'
      - 'scripts/build_site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write   # push the built site to gh-pages

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Build site
        run: python scripts/build_site.py _site
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          force_orphan: true   # keep gh-pages a single commit so old audio does not pile up in history
          commit_message: 'Publish voice browser'
